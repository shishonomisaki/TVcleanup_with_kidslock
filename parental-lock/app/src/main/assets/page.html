<script>
// Before the first paint, so a saved light/dark choice never flashes the other one.

<style>
/* Living room at night: night blue, a lamp's amber for time to watch, a signal red for the lock. */
:root{--bg:#EDEFF6;--card:#FFFFFF;--raise:#E3E6F1;--fg:#1A1E3A;--mute:#5D6378;--line:#D5D9E8;
  --amber:#F2B84B;--amber-ink:#8A5A00;--on-amber:#1A1E3A;--red:#C9343A;--track:#E3E6F1;--ok:#1A1E3A;--on-ok:#F2B84B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1E3A;--card:#242950;--raise:#2E3462;
  --fg:#E9EBF5;--mute:#8A90A8;--line:#363C6E;--amber:#F2B84B;--amber-ink:#F2B84B;--on-amber:#1A1E3A;--red:#E5484D;
  --track:#2E3462;--ok:#F2B84B;--on-ok:#1A1E3A}}
:root[data-theme="dark"]{--bg:#1A1E3A;--card:#242950;--raise:#2E3462;--fg:#E9EBF5;--mute:#8A90A8;--line:#363C6E;
  --amber:#F2B84B;--amber-ink:#F2B84B;--on-amber:#1A1E3A;--red:#E5484D;--track:#2E3462;--ok:#F2B84B;--on-ok:#1A1E3A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;
  -webkit-tap-highlight-color:transparent}
main{max-width:440px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
h1{font-size:18px;margin:0;font-weight:700}
.conn{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--amber)}
section[hidden]{display:none}
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:12px}
.lbl{font-size:14px;color:var(--mute);margin:0 0 10px}
button{font:inherit;color:inherit;background:var(--raise);border:0;border-radius:14px;padding:14px;cursor:pointer;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button:active:not(:disabled){filter:brightness(1.15)}
.primary{width:100%;background:var(--amber);color:var(--on-amber);font-weight:700;margin-top:12px}
.err{min-height:22px;font-size:14px;color:var(--red);margin-top:8px}
.err.good{color:var(--amber-ink)}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
input,select{font:inherit;width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input.pin{font-size:22px;letter-spacing:10px;text-align:center}
input.pin::placeholder{letter-spacing:normal;font-size:16px}
.num{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;font-variant-numeric:tabular-nums}

/* Time tab */
.ring{position:relative;width:220px;height:220px;margin:4px auto 0}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:12}
#arc{stroke-linecap:round;transition:stroke-dashoffset .8s,stroke .3s}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#big{font-size:46px;font-weight:700;line-height:1.1}
#big svg{width:48px;height:48px;fill:var(--red)}
#label{font-size:15px;color:var(--mute)}
.showing{text-align:center;font-size:15px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:17px}
.stats span{font-size:12px;color:var(--mute)}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.picks button{padding:14px 0;font-weight:600}
.picks button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber)}
.picks small{display:block;font-size:11px;font-weight:400;opacity:.75}
.hold{position:relative;overflow:hidden;width:100%;margin-top:10px;background:transparent;border:2px solid var(--red);color:var(--red);font-weight:700}
.hold i{position:absolute;inset:0;background:var(--red);transform:scaleX(0);transform-origin:left;opacity:.25}
.hold.going i{transform:scaleX(1);transition:transform 1s linear}
details{margin-top:12px}
summary{cursor:pointer;color:var(--mute);font-size:14px;padding:8px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--raise);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:10px 0;background:transparent;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:700}

/* Remote tab */
.rtop{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.rstate{font-size:15px;font-weight:600}
.rstate.locked{color:var(--red)}
.pw{width:40px;height:40px;padding:0;border-radius:50%;background:transparent;border:2px solid var(--red);color:var(--red);
  display:flex;align-items:center;justify-content:center}
.pw svg{width:20px;height:20px;fill:currentColor}
/* The D-pad is a ring, like the countdown: four arcs and OK in the middle. */
.dpad{position:relative;width:min(100%,264px);aspect-ratio:1;margin:12px auto 4px;border-radius:50%;background:var(--raise)}
.dpad button{position:absolute;background:transparent;border-radius:0;padding:0;display:flex;align-items:center;justify-content:center}
.dpad button svg{width:30px;height:30px;fill:var(--fg)}
.dpad .u{top:0;left:30%;width:40%;height:30%}
.dpad .d{bottom:0;left:30%;width:40%;height:30%}
.dpad .l{left:0;top:30%;width:30%;height:40%}
.dpad .r{right:0;top:30%;width:30%;height:40%}
.dpad .u:active,.dpad .d:active,.dpad .l:active,.dpad .r:active{background:radial-gradient(circle,var(--line) 0 45%,transparent 46%)}
.dpad .ok{top:30%;left:30%;width:40%;height:40%;border-radius:50%;background:var(--ok);color:var(--on-ok);font-weight:800;font-size:20px;
  box-shadow:0 0 0 8px var(--card)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keys button{height:60px;padding:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;line-height:1}
.keys svg{width:30px;height:30px;fill:currentColor}
.locked-remote .dpad,.locked-remote .keys,.locked-remote .apps{opacity:.35}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.apps button{height:56px;padding:0 6px;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apps button.empty{background:transparent;border:2px dashed var(--line);color:var(--mute);font-size:24px;font-weight:400}
.apps.editing button{outline:2px dashed var(--amber);outline-offset:-2px}
.apps button.picked{background:var(--amber);color:var(--on-amber)}
.link{background:none;padding:10px 0 0;color:var(--amber-ink);font-size:14px}
#appbox select,#appbox input{margin-top:8px}

/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:6px 16px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}
nav button{flex:1;max-width:204px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;font-size:12px;color:var(--mute)}
nav button svg{width:26px;height:26px;fill:currentColor}
nav button[aria-selected="true"]{color:var(--fg);font-weight:700}
nav button[aria-selected="true"] svg{fill:var(--amber-ink)}
@media (prefers-reduced-motion:reduce){#arc,.hold.going i{transition:none}}
</style></head><body>
<main>
<header><h1 data-t="title"></h1><span class="conn"><span class="dot" id="dot"></span><span id="online"></span></span></header>

<section id="tab-time" role="tabpanel">
  <div class="card" id="setup" hidden><p class="lbl" data-t="setupTitle"></p>
    <input id="newpin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" data-p="newPin">
    <input id="newpin2" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" data-p="again" style="margin-top:8px">
    <button class="primary" id="savepin" data-t="savePin"></button><div class="err" id="setmsg"></div></div>

  <div class="card">
    <div class="ring"><svg width="220" height="220" viewBox="0 0 220 220">
      <circle cx="110" cy="110" r="96" stroke="var(--track)"/>
      <circle id="arc" cx="110" cy="110" r="96" stroke="var(--mute)" stroke-dasharray="603.19" stroke-dashoffset="603.19"/>
    </svg><div class="center"><div id="big" class="num">--:--</div><div id="label"></div></div></div>
    <div class="showing"><span data-t="watching"></span><b id="showing">—</b></div>
    <div class="stats"><div><b id="watched" class="num">—</b><span data-t="watchedToday"></span></div>
      <div><b id="unlocks" class="num">—</b><span data-t="unlocksToday"></span></div>
      <div><b id="setstate">—</b><span data-t="settings"></span></div></div>
  </div>

  <!-- Locked: pick a time, PIN, unlock. -->
  <div class="card" id="whenLocked" hidden>
    <p class="lbl" data-t="step1"></p><div class="picks" id="picks"></div>
    <p class="lbl" data-t="step2" style="margin-top:14px"></p>
    <input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
    <button class="primary" id="go" disabled data-t="unlock"></button><div class="err" id="msg"></div>
  </div>

  <!-- Open: more time, lock, and the rarer things under "More". -->
  <div class="card" id="whenOpen" hidden>
    <button class="primary" id="ext" style="margin-top:0" disabled data-t="extend"></button>
    <div class="hint" id="exthint"></div>
    <input id="pin2" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" data-p="pinFor" style="margin-top:10px" hidden>
    <button class="hold" id="lock"><i></i><span data-t="holdLock"></span></button>
    <div class="err" id="msg3"></div>
  </div>

  <details id="more"><summary data-t="more"></summary>
    <div class="card" style="margin-top:4px"><p class="lbl" data-t="openSettings"></p>
      <input id="pin3" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
      <button class="primary" id="set" data-t="openSettingsGo"></button>
      <div class="hint" data-t="settingsHelp"></div><div class="err" id="msg2"></div></div>
    <div class="card"><p class="lbl" data-t="theme"></p>
      <div class="seg" id="theme"><button data-v="auto" data-t="themeAuto"></button><button data-v="light" data-t="themeLight"></button>
        <button data-v="dark" data-t="themeDark"></button></div></div>
  </details>
</section>

<section id="tab-remote" role="tabpanel" hidden>
  <div class="card" id="noremote" hidden><p class="lbl" data-t="e_remote_off" style="margin:0"></p></div>
  <div class="card" id="remote">
    <div class="rtop"><span class="rstate" id="rstate"></span>
      <button class="pw" data-k="POWER" data-a="power"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg></button></div>
    <div class="dpad">
      <button class="u" data-k="DPAD_UP" data-a="up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5z"/></svg></button>
      <button class="l" data-k="DPAD_LEFT" data-a="left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 7l-5 5 5 5z"/></svg></button>
      <button class="ok" data-k="DPAD_CENTER">OK</button>
      <button class="r" data-k="DPAD_RIGHT" data-a="right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5z"/></svg></button>
      <button class="d" data-k="DPAD_DOWN" data-a="down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></button>
    </div>
    <div class="keys">
      <button data-k="BACK" data-a="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <button data-k="HOME" data-a="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
      <button data-k="MEDIA_PLAY_PAUSE" data-a="playPause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5v14l10-7z M14 5h3v14h-3z M19 5h3v14h-3z"/></svg></button>
      <button data-k="VOLUME_DOWN" data-a="volDown">−</button>
      <button data-k="VOLUME_MUTE" data-a="mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button>
      <button data-k="VOLUME_UP" data-a="volUp">+</button>
    </div>
  </div>
  <div class="card" id="appcard"><p class="lbl" data-t="apps"></p>
    <div class="apps" id="apps"></div>
    <button class="link" id="appedit" data-t="editApps"></button>
    <div id="appbox" hidden><b id="appslot"></b><select id="apppick"></select>
      <input id="apppin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" data-p="appPin">
      <button class="primary" id="appsave" data-t="save"></button></div>
  </div>
  <div class="err" id="msg4"></div>
</section>
</main>

<nav role="tablist">
  <button role="tab" id="t-time" aria-controls="tab-time"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7z"/></svg><span data-t="tabTime"></span></button>
  <button role="tab" id="t-remote" aria-controls="tab-remote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H9a2 2 0 00-2 2v16a2 2 0 002 2h6a2 2 0 002-2V4a2 2 0 00-2-2zm-3 3a2 2 0 110 4 2 2 0 010-4zm0 7a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm-2 5h4v2h-4z"/></svg><span data-t="tabRemote"></span></button>
</nav>

// Tabs, remembered on this phone.
function tab(name) {

$('t-time').onclick = function () { tab('time'); };
$('t-remote').onclick = function () { tab('remote'); };
tab(store('tab') === 'remote' ? 'remote' : 'time');

// Light, dark, or the phone's choice.
function theme(v) {
  if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v);
  else document.documentElement.removeAttribute('data-theme');
  $('theme').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === v ? 'true' : 'false'); });
  store('theme', v);
}
$('theme').querySelectorAll('button').forEach(function (b) { b.onclick = function () { theme(b.getAttribute('data-v')); }; });
theme(store('theme') || 'auto');

var C = 603.19, mins = 0, last = null, lastOk = 0;
var LOCK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6A5 5 0 007 6v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zM9 6a3 3 0 016 0v2H9V6zm3 11a2 2 0 110-4 2 2 0 010 4z"/></svg>';
var pin = $('pin'), go = $('go'), msg = $('msg');
[30, 60, 90, 120].forEach(function (m) {
  var b = document.createElement('button');
  b.innerHTML = '<span class="num">' + m + '</span><small>' + T.min + '</small>';
  b.setAttribute('aria-pressed', 'false');
  b.onclick = function () {
    mins = m;
    document.querySelectorAll('#picks button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    upd();
  };
  $('picks').appendChild(b);
});
function upd() { go.disabled = !(mins && isPin(pin.value)); }
pin.oninput = upd;
function mmss(s) { var m = Math.floor(s / 60), x = s % 60; return m + ':' + (x < 10 ? '0' : '') + x; }
function hm(s) { var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + T.h + m + T.m : m + T.m; }
function hhmm(d) { return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes(); }
function ring(color, frac) { $('arc').style.stroke = color; $('arc').style.strokeDashoffset = C * (1 - frac); }

var shownBig = '';
function big(html) { if (html !== shownBig) { $('big').innerHTML = html; shownBig = html; } }

function draw() {
  var s = last;
  if (!s) {
    $('dot').className = 'dot'; $('online').textContent = T.offline;
    big('--:--'); $('label').textContent = T.unreachable; ring('var(--mute)', 0);
    $('rstate').textContent = T.unreachable; $('rstate').className = 'rstate locked';
    return;
  }
  $('dot').className = 'dot on'; $('online').textContent = T.online;
  var left = Math.max(0, s.remainingSec - Math.floor((Date.now() - lastOk) / 1000));
  var shut = s.locked || left <= 0;
  if (shut) { big(LOCK_ICON); $('label').textContent = T.locked; ring('var(--red)', 1); }
  else { big(mmss(left)); $('label').textContent = T.open; ring('var(--amber)', s.durationSec ? Math.min(1, left / s.durationSec) : 1); }
  $('showing').textContent = T[s.showing] || s.showing || '—';
  $('watched').textContent = hm(s.watchedTodaySec);
  $('unlocks').textContent = s.unlocksToday + T.times;
  $('setstate').textContent = s.settingsOpen ? T.setOpen : T.setShut;
  $('setup').hidden = s.hasPin;
  // What the parent can do next depends on the state: unlock while locked, extend or lock while open.
  $('whenLocked').hidden = !s.hasPin || !shut;
  $('whenOpen').hidden = shut;
  var used = s.extensions || 0, max = s.maxExtensions || 2;
  $('ext').disabled = used >= max;
  $('exthint').textContent = used >= max ? T.extHintMax : used ? T.extHint1 : T.extHint0;
  $('pin2').hidden = used === 0 || used >= max;
  // Remote tab.
  $('noremote').hidden = !!s.remote; $('remote').hidden = !s.remote;
  $('rstate').textContent = shut ? T.locked : T.left + mmss(left) + (ZH ? '' : ' ' + T.open);
  $('rstate').className = shut ? 'rstate locked' : 'rstate num';
  $('tab-remote').classList.toggle('locked-remote', shut);
  drawApps(s.apps || []);
}
function show(s) { last = s; lastOk = Date.now(); draw(); }
function poll() {
  fetch('/api/status', {cache: 'no-store'}).then(function (r) { return r.json(); }).then(show)
    .catch(function () { last = null; draw(); });
}
function api(path, body) {
  var f = Object.keys(body || {}).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(body[k]); }).join('&');
  return fetch(path, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: f})
    .then(function (r) { return r.json(); }).then(function (s) { show(s); return s; });
}

go.onclick = function () {
  say(msg);
  api('/api/unlock', {minutes: mins, pin: pin.value}).then(function (s) {
    say(msg, E(s)); if (!s.error) { pin.value = ''; upd(); }
  }).catch(function () { say(msg, T.noTv); });
};

var msg3 = $('msg3');
$('ext').onclick = function () {
  say(msg3);
  var needPin = last && last.extensions > 0, p2 = $('pin2');
  if (needPin && !isPin(p2.value)) { say(msg3, T.pinFor); p2.focus(); return; }
  api('/api/extend', needPin ? {pin: p2.value} : {}).then(function (s) {
    if (s.error) { say(msg3, E(s)); return; }
    p2.value = ''; say(msg3, T.extended, true);
  }).catch(function () { say(msg3, T.noTv); });
};

// Lock now: hold for a second, so a stray tap does nothing.
(function () {
  var b = $('lock'), timer = 0;
  function cancel() { clearTimeout(timer); timer = 0; b.classList.remove('going'); }
  b.addEventListener('pointerdown', function (e) {
    e.preventDefault(); say(msg3); b.classList.add('going');
    timer = setTimeout(function () {
      timer = 0; b.classList.remove('going'); buzz();
      api('/api/lock', {}).then(function () { say(msg3, T.locking, true); }).catch(function () { say(msg3, T.noTv); });
    }, 1000);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, cancel); });
  b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();

$('set').onclick = function () {
  var m2 = $('msg2'), p3 = $('pin3'); say(m2);
  if (!isPin(p3.value)) { say(m2, T.pinFormat); return; }
  api('/api/settings', {pin: p3.value}).then(function (s) {
    if (s.error) { say(m2, E(s)); return; }
    p3.value = ''; say(m2, T.settingsUntil + hhmm(new Date(Date.now() + s.settingsLeftSec * 1000)), true);
  }).catch(function () { say(m2, T.noTv); });
};

$('savepin').onclick = function () {
  var a = $('newpin').value, b = $('newpin2').value, sm = $('setmsg');
  if (!isPin(a)) { say(sm, T.pinFormat); return; }
  if (a !== b) { say(sm, T.pinMismatch); return; }
  api('/api/setpin', {pin: a}).then(function (s) { say(sm, E(s)); }).catch(function () { say(sm, T.noTv); });
};

var msg4 = $('msg4');
document.querySelectorAll('[data-k]').forEach(function (b) {
  b.onclick = function () {
    buzz();
    api('/api/key', {key: b.getAttribute('data-k')}).then(function (s) { say(msg4, E(s)); })
      .catch(function () { say(msg4, T.noTv); });
  };
});

// App buttons: rebuilt only when the slots change, so a tap is never lost to the 1 s redraw.
var appsSeen = '', editMode = false, editSlot = -1, appList = null;
function drawApps(a) {
  var j = JSON.stringify(a); if (j === appsSeen) return; appsSeen = j;
  var box = $('apps'); box.innerHTML = '';
  a.forEach(function (x, i) {
    var b = document.createElement('button');
    if (x) b.textContent = x.label; else { b.className = 'empty'; b.textContent = '+'; }
    b.onclick = function () { if (editMode || !x) openEdit(i); else launch(i); };
    box.appendChild(b);
  });
  markSlot();
}
// Editing: the slot is the button tapped, never a separate list, so the wrong slot cannot be saved.
function markSlot() { var bs = $('apps').children; for (var k = 0; k < bs.length; k++) bs[k].classList.toggle('picked', editMode && k === editSlot); }
function setEdit(on) {
  editMode = on; editSlot = -1; $('apps').classList.toggle('editing', on);
  $('appedit').textContent = on ? T.doneApps : T.editApps; $('appbox').hidden = true;
  say(msg4, on ? T.pickSlot : '', true); markSlot();
}
function launch(i) {
  buzz();
  api('/api/launch', {slot: i}).then(function (s) { say(msg4, E(s)); }).catch(function () { say(msg4, T.noTv); });
}
function openEdit(i) {
  if (!editMode) setEdit(true);
  editSlot = i; markSlot(); say(msg4);
  $('appslot').textContent = T.slot + (i + 1) + T.slotOf; $('appbox').hidden = false;
  if (appList) return pickCurrent();
  fetch('/api/apps').then(function (r) { return r.json(); }).then(function (d) {
    appList = d.apps; var p = $('apppick'), o = document.createElement('option');
    o.value = ''; o.textContent = T.none; p.appendChild(o);
    appList.forEach(function (x) { var o = document.createElement('option'); o.value = x.pkg; o.textContent = x.label; p.appendChild(o); });
    pickCurrent();
  }).catch(function () { say(msg4, T.noTv); });
}
function pickCurrent() { var a = last && last.apps && last.apps[editSlot]; $('apppick').value = a ? a.pkg : ''; }
$('appedit').onclick = function () { setEdit(!editMode); };
$('appsave').onclick = function () {
  var ap = $('apppin'); say(msg4); if (editSlot < 0) return;
  if (!isPin(ap.value)) { say(msg4, T.pinFormat); return; }
  api('/api/shortcut', {slot: editSlot, pkg: $('apppick').value, pin: ap.value}).then(function (s) {
    if (s.error) { say(msg4, E(s)); return; }
    ap.value = ''; setEdit(false); say(msg4, T.saved, true);
  }).catch(function () { say(msg4, T.noTv); });
};

poll(); setInterval(poll, 5000); setInterval(draw, 1000);
</script>
</body></html>
